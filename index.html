<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Genshin Generator</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, #ff8a3d, #e93636, #9e1f38);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px 15px;
      color: #2d1515;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: rgba(255, 248, 241, 0.96);
      border-radius: 28px;
      padding: 35px 25px;
      box-shadow: 0 15px 45px rgba(60, 10, 10, 0.35);
      text-align: center;
    }

    .subtitle {
      font-family: 'Cinzel', serif;
      font-size: 17px;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 3px;
      color: #9e3434;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(32px, 9vw, 58px);
      letter-spacing: 3px;
      color: #7d202d;
      margin-bottom: 12px;
    }

    .description {
      font-size: 13px;
      color: #744c4c;
      margin-bottom: 28px;
    }

    .generate-btn {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 18px 20px;
      background: linear-gradient(135deg, #d93434, #a91e35);
      color: white;
      font-family: 'Cinzel', serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 3px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(150, 25, 35, 0.3);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      margin-bottom: 25px;
    }

    .generate-btn:active {
      transform: scale(0.97);
      box-shadow: 0 4px 10px rgba(150, 25, 35, 0.3);
    }

    .results {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .result-card {
      background: white;
      border-radius: 17px;
      padding: 15px 18px;
      box-shadow: 0 4px 12px rgba(80, 20, 20, 0.12);
      text-align: left;
      border-left: 5px solid #d93434;
      transition: transform 0.2s ease;
    }

    .result-card.show {
      animation: appear 0.4s ease;
    }

    .label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #a84949;
      margin-bottom: 5px;
    }

    .name {
      font-family: 'Cinzel', serif;
      font-size: clamp(18px, 5vw, 25px);
      font-weight: 600;
      color: #351818;
      word-break: break-word;
    }

    .empty {
      opacity: 0.55;
    }

    .footer {
      margin-top: 24px;
      font-size: 10px;
      color: #9b7373;
      letter-spacing: 1px;
    }

    @keyframes appear {
      0% {
        opacity: 0;
        transform: translateY(8px) scale(0.98);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 15px 10px;
      }

      .container {
        padding: 28px 17px;
        border-radius: 23px;
      }

      h1 {
        letter-spacing: 1px;
      }

      .generate-btn {
        padding: 17px 15px;
      }

      .result-card {
        padding: 13px 15px;
      }
    }
  </style>
</head>

    // =========================

    function randomName(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function showResult(id, value) {
      const element = document.getElementById(id);
      const card = document.getElementById("card-" + id);

      element.textContent = value;
      element.classList.remove("empty");

      card.classList.remove("show");

      // Riavvia l'animazione
      void card.offsetWidth;

      card.classList.add("show");
    }

    function generateAll() {

      // Piccola pausa per dare un effetto di estrazione
      const button = document.querySelector(".generate-btn");

      button.disabled = true;
      button.textContent = "ESTRAZIONE...";

      setTimeout(() => {

        showResult("boss", randomName(boss));
        showResult("matteo", randomName(matteo));
        showResult("susi", randomName(susi));
        showResult("giulia", randomName(giulia));
        showResult("extra", randomName(extra));

        button.disabled = false;
        button.textContent = "GENERA";

      }, 450);
